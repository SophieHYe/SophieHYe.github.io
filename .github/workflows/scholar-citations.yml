name: Update Scholar citations

on:
  schedule:
    - cron: '17 4 * * *'   # daily ~04:17 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # this workflow commits the refreshed count

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch citation count
        run: python .github/scripts/scholar_citations.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- _data/scholar.yml; then
            echo "No change in citation count."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add _data/scholar.yml
            git commit -m "chore: update Scholar citation count [skip ci]"
            git push
          fi
